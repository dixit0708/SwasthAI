<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <title>SwasthAI - Log In</title>
    <meta name="description" content="Log in to your SwasthAI account to access your health profile, AI assessments and health insights.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="login">

    <div id="site-header"></div>

    <div class="auth-shell">
        <div class="auth-shell__form">
            <div class="auth-shell__form-inner">
                <h1>Welcome back</h1>
                <p>Log in to continue your health journey.</p>
                <div id="loginAlert" class="auth-alert" style="display: none;"><i class="fas fa-circle-exclamation"></i> <span id="loginAlertText"></span></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" class="form-control" required placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Password</label>
                        <div class="form-password">
                            <input type="password" id="loginPassword" class="form-control" required placeholder="Enter your password">
                            <button type="button" class="form-password__toggle" id="loginPasswordToggle" aria-label="Show password"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="auth-check-row">
                        <label class="form-check"><input type="checkbox"> Remember me</label>
                        <a href="forgot-password.html">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg btn-block" id="loginSubmit">Log In</button>
                </form>
                <p class="auth-footer-note">Don't have an account? <a href="register.html">Sign up</a></p>
            </div>
        </div>
        <div class="auth-shell__visual">
            <div class="auth-scene" id="authScene"></div>
            <div class="auth-shell__visual-content">
                <h2>Your health, all in one place.</h2>
                <p>Pick up right where you left off, assessments, records, insights and your family's health, all in one account.</p>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="js/site-nav.js"></script>
    <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/auth-scene.js"></script>
    <script>
        SwasthAuth.initPasswordToggle('#loginPasswordToggle', '#loginPassword');
        SwasthAuth.initAuthScene({ scene: '#authScene', email: '#loginEmail', password: '#loginPassword' });

        const loginForm = document.getElementById('loginForm');
        const loginAlert = document.getElementById('loginAlert');
        const loginAlertText = document.getElementById('loginAlertText');
        const loginSubmit = document.getElementById('loginSubmit');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginAlert.style.display = 'none';
            loginSubmit.disabled = true;
            loginSubmit.textContent = 'Logging in...';
            try {
                const data = await SwasthAPI.login(
                    document.getElementById('loginEmail').value.trim(),
                    document.getElementById('loginPassword').value
                );
                swasthaiStoreSession(data);
                const params = new URLSearchParams(window.location.search);
                window.location.href = params.get('next') || 'dashboard.html';
            } catch (err) {
                loginAlertText.textContent = err.message;
                loginAlert.style.display = 'flex';
                loginSubmit.disabled = false;
                loginSubmit.textContent = 'Log In';
            }
        });
    </script>
</body>
</html>
