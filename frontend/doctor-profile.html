<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <title>SwasthAI - Doctor Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/doctors.css">
</head>
<body>
    <script src="js/auth-guard.js"></script>
    <div id="app-layout" class="app-layout">
        <aside id="sidebar-container" class="sidebar"></aside>
        <div class="main-content">
            <header id="header-container" class="top-header"></header>
            <main class="page-content">
                <!-- PAGE CONTENT: doctor-profile -->
                <div class="dir-page">
                    <a href="doctors.html" class="dir-back" id="dpBack"><i class="fas fa-arrow-left"></i> Back to doctors</a>

                    <div id="dpContent" aria-live="polite">
                        <div class="dir-skeleton" style="height: 136px; margin-bottom: var(--sp-6);"></div>
                        <div class="dir-skeleton" style="height: 320px;"></div>
                    </div>

                    <div class="dir-emergency" role="note" style="margin-top: var(--sp-6);">
                        <i class="fas fa-truck-medical" aria-hidden="true"></i>
                        <span><strong>Medical emergency?</strong> Call for help now instead of visiting a clinic.</span>
                        <span class="dir-emergency__links">
                            <a href="tel:112"><i class="fas fa-phone"></i> 112</a>
                            <a href="tel:108"><i class="fas fa-ambulance"></i> 108 Ambulance</a>
                        </span>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/doctor-ui.js"></script>
    <script src="js/doctor-profile.js"></script>
    <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
