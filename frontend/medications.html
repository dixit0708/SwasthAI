<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwasthAI - Medications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <script src="js/auth-guard.js"></script>
    <div id="app-layout" class="app-layout">
        <aside id="sidebar-container" class="sidebar"></aside>
        <div class="main-content">
            <header id="header-container" class="top-header"></header>
            <main class="page-content">
                <!-- PAGE CONTENT: medications -->
                
    <div class="flex-between mb-4">
        <div>
            <h1 style="margin:0;">Medications</h1>
            <p class="text-secondary">Track your active prescriptions and reminders.</p>
        </div>
        <button class="btn btn-primary"><i class="fas fa-plus"></i> Add Medication</button>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Medication Name</th>
                        <th>Dosage</th>
                        <th>Frequency</th>
                        <th>Next Reminder</th>
                        <th>Adherence</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>Lisinopril</strong></td>
                        <td>10mg</td>
                        <td>Once daily (Morning)</td>
                        <td><span class="badge badge-warning">Today, 08:00 AM</span></td>
                        <td><span class="text-success"><i class="fas fa-check-circle"></i> 95%</span></td>
                        <td><button class="btn btn-outline" style="padding: 0.2rem 0.5rem;"><i class="fas fa-edit"></i></button></td>
                    </tr>
                    <tr>
                        <td><strong>Metformin</strong></td>
                        <td>500mg</td>
                        <td>Twice daily (Meals)</td>
                        <td><span class="badge badge-success">Tomorrow, 08:00 AM</span></td>
                        <td><span class="text-success"><i class="fas fa-check-circle"></i> 100%</span></td>
                        <td><button class="btn btn-outline" style="padding: 0.2rem 0.5rem;"><i class="fas fa-edit"></i></button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
            </main>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/medications.js"></script>
    <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
