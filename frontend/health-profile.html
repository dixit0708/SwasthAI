<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <title>SwasthAI - Health Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <script src="js/auth-guard.js"></script>
    <div id="app-layout" class="app-layout">
        <aside id="sidebar-container" class="sidebar"></aside>
        <div class="main-content">
            <header id="header-container" class="top-header"></header>
            <main class="page-content">
                <!-- PAGE CONTENT: health-profile -->
                
    <div class="mb-4">
        <h1>Health Profile</h1>
        <p class="text-secondary">Manage your personal and health information.</p>
    </div>
    <div class="grid" style="grid-template-columns: 2fr 1fr;">
        <div class="card">
            <div class="card-header">Basic Information</div>
            <div class="card-body">
                <form id="hpForm">
                    <div id="hpFormAlert" class="auth-alert" style="display: none;"><i class="fas fa-circle-exclamation"></i> <span id="hpFormAlertText"></span></div>
                    <div class="grid" style="grid-template-columns: 1fr 1fr;">
                        <div class="form-group"><label class="form-label">First Name</label><input type="text" class="form-control" id="hpFirstName" placeholder="First name"></div>
                        <div class="form-group"><label class="form-label">Last Name</label><input type="text" class="form-control" id="hpLastName" placeholder="Last name"></div>
                        <div class="form-group"><label class="form-label">Date of Birth</label><input type="date" class="form-control" id="hpDob"></div>
                        <div class="form-group"><label class="form-label">Blood Group</label>
                            <select class="form-control" id="hpBloodGroup">
                                <option value="">Not set</option>
                                <option>O+</option><option>O-</option>
                                <option>A+</option><option>A-</option>
                                <option>B+</option><option>B-</option>
                                <option>AB+</option><option>AB-</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4" id="hpSaveBtn">Save Changes</button>
                </form>
            </div>
        </div>
        <div class="card">
            <div class="card-header">Known Conditions & Allergies</div>
            <div class="card-body">
                <p class="text-muted" style="font-size: 0.9rem; display: none;" id="hpConditionsEmpty"><i class="fas fa-circle-info"></i> No conditions or allergies added yet.</p>
                <ul id="hpConditionsList" style="list-style: none; padding: 0;"></ul>
                <button type="button" class="btn btn-outline btn-block mt-4" id="hpAddConditionBtn"><i class="fas fa-plus"></i> Add Condition</button>
            </div>
        </div>
    </div>

            </main>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/health-profile.js"></script>
    <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
